[package]
name = "delta-host-runtime"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Credential-private embedded Delta node for native UI hosts"

[dependencies]
delta-node = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

fs2 = "0.4"

[features]
default = []
desktop = ["delta-node/native-processes", "delta-node/host-telemetry"]

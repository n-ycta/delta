[package]
name = "delta-node"
version = "0.1.0"
edition = "2021"
description = "Delta: one API for nodes, components and capabilities"
license = "MIT"

[lib]
name = "delta"
path = "src/lib.rs"

[[bin]]
name = "delta"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "io-util", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

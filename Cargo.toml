[package]
name = "delta-node"
version = "0.4.5"
edition = "2021"
description = "Delta: one API for nodes, components and capabilities"
license = "Apache-2.0"

[lib]
name = "delta"
path = "src/lib.rs"

[[bin]]
name = "delta"
path = "src/main.rs"

[dependencies]
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "io-util", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

sysinfo = { version = "0.33", optional = true }
k256 = { version = "0.13", features = ["schnorr"] }

flate2 = "1"
tar = "0.4"

[features]
default = ["native-processes", "host-telemetry"]
native-processes = []
host-telemetry = ["dep:sysinfo"]

[workspace]
members = ["crates/host-runtime"]
resolver = "2"
